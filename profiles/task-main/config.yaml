mcp_servers:
  aota:
    command: /usr/bin/python3
    args:
    - -m
    - aota_forge.composition.worker_vertical_slice
    - --mcp-server
    env:
      PYTHONPATH: ${AOTA_FORGE_REPO_ROOT}
      AOTA_W3_MCP_ROOT: ${AOTA_W3_MCP_ROOT}
      AOTA_W3_PROJECT_ID: ${AOTA_W3_PROJECT_ID}
      AOTA_W3_WORKTREE_ID: ${AOTA_W3_WORKTREE_ID}
      AOTA_W3_TASK_ID: ${AOTA_W3_TASK_ID}
      AOTA_W3_HANDOFF_JSON: ${AOTA_W3_HANDOFF_JSON}
      AOTA_W3_TOOL_TRACE: ${AOTA_W3_TOOL_TRACE}
      AOTA_TASK_MAIN_BOOTSTRAP: ${AOTA_TASK_MAIN_BOOTSTRAP}
      AOTA_TASK_MAIN_TRACE: ${AOTA_TASK_MAIN_TRACE}
    enabled: true
plugins:
  enabled:
  - aota-tools
  disabled: []
providers:
  agnes:
    api: http://100.123.10.71:8792/v1
    key_env: AMF_PROXY_AGNES_KEY
    models:
    - agnes-2.0-flash
    name: Agnes AI via AOTA Proxy
  opencode-go:
    key_env: OPENCODE_GO_API_KEY
    api: http://100.123.10.71:8792/v1
    models:
    - deepseek-v4-flash
    - deepseek-v4-pro
    - kimi-k2.6
  ollama-cloud:
    api: http://100.123.10.71:8792/v1
    key_env: OLLAMA_API_KEY
    models:
    - glm-5.2
