_config_version: 33
model:
  default: glm-5.2
  provider: ollama-cloud
agent:
  max_turns: 40
  disabled_toolsets:
    - aota_workspace_readonly
    - aota_fs_copy
    - aota_architect_artifact
    - aota_coder_artifact
    - aota_coder_command
    - aota_coder_file_mutation
    - aota_debugger_artifact
    - aota_project_steward
    - aota_project_steward_artifact
    - aota_webui_attachment_read
    - aota_handoff
    - aota_orchestration
    - aota_operator
    - aota_plan_read
    - aota_plan_write
    - aota_profile_task
    - aota_task_spec
    - aota_web_readonly
    - aota_work_intake
    - aota_codegraph_rebuild
    - file
    - terminal
  reasoning_effort: max
  task_completion_guidance: true
toolsets:
  - aota_core
  - aota_fs_readonly
  - aota_repo_readonly
  - aota_project_readonly
  - aota_codegraph_readonly
  - aota_worker_outcome
  - aota_reviewer_artifact
  - aota_active_task_context
  - skills-readonly
platform_toolsets:
  api_server:
    - aota_core
    - aota_fs_readonly
    - aota_repo_readonly
    - aota_project_readonly
    - aota_codegraph_readonly
    - aota_worker_outcome
    - aota_reviewer_artifact
    - aota_active_task_context
    - skills-readonly
  cli:
    - aota_core
    - aota_fs_readonly
    - aota_repo_readonly
    - aota_project_readonly
    - aota_codegraph_readonly
    - aota_worker_outcome
    - aota_reviewer_artifact
    - aota_active_task_context
    - skills-readonly
plugins:
  enabled:
    - aota-tools
  disabled: []
providers:
  agnes:
    api: http://100.123.10.71:8792/v1
    key_env: AMF_PROXY_AGNES_KEY
    models:
      - agnes-2.0-flash
    name: Agnes AI via AOTA Proxy
  opencode-go:
    key_env: OPENCODE_GO_API_KEY
    api: http://100.123.10.71:8792/v1
    models:
      - deepseek-v4-flash
      - deepseek-v4-pro
      - kimi-k2.6
  ollama-cloud:
    api: http://100.123.10.71:8792/v1
    key_env: OLLAMA_API_KEY
    models:
      - glm-5.2
delegation:
  max_concurrent_children: 0
  max_spawn_depth: 0
  orchestrator_enabled: false
memory:
  memory_enabled: false
  user_profile_enabled: false
compression:
  enabled: false
skills:
  allowlist:
    - aota-implementation-review
    - workspace-file-access-strategy
  reference_allowlist: []
  disabled:
    - aota-evidence-first-debugging
    - aota-profile-task-orchestration
    - aota-spec-driven-implementation
    - aota-verification
    - ask-matt
    - code-review
    - codebase-design
    - design-an-interface
    - diagnosing-bugs
    - domain-modeling
    - grill-with-docs
    - hermes-agent-architecture
    - hermes-debugging
    - hermes-override-sync
    - hermes-plugin-development
    - implement
    - improve-codebase-architecture
    - petdex
    - prototype
    - qa
    - request-refactor-plan
    - research
    - resolving-merge-conflicts
    - setup-matt-pocock-skills
    - simplify-code
    - tdd
    - to-spec
    - to-tickets
    - triage
    - ubiquitous-language
    - wayfinder
    - aota-architecture-review
  write_approval: false
  guard_agent_created: false
display:
  interface: cli
  streaming: true
  show_reasoning: false
  personality: kawaii
  language: en
security:
  redact_secrets: true
  tirith_enabled: false
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
tool_output:
  max_bytes: 50000
  max_lines: 2000
  max_line_length: 2000
timezone: Asia/Taipei
