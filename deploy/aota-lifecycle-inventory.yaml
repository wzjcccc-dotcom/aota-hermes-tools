# Governance metadata only. Registration, profile configs, and the managed
# manifest remain authoritative; verifiers reject declarations that disagree.
schema_version: 1
credential_authority:
  host_global_root: /home/latios/.hermes
  api_key_source: /home/latios/.hermes/.env
  oauth_source: /home/latios/.hermes/auth.json
  profile_selector: "hermes -p <profile>"
  worker_hermes_home: global_root_only
  forbidden_sources:
    - profiles/<target>/.env
    - profiles/default/.env
    - parent_profile_environment
    - caller_supplied_env_path
  provider_metadata:
    opencode-go: {auth_type: api_key, key_env: OPENCODE_GO_API_KEY, base_url_env: OPENCODE_GO_BASE_URL}
    openai-codex: {auth_type: oauth, auth_file: auth.json}
  container_views:
    agent: /home/hermes/.hermes
    webui: /home/hermeswebui/.hermes
  secret_policy: no_repository_copy_no_receipt_value_no_log_value
runtime_topology:
  active_webui_transport: legacy_in_process
  plugin_import_processes: [hermes-agent, hermes-webui]
  known_transports: [cli, api_server]
  required_activation_targets: [hermes-agent, hermes-webui, new-session]
profiles: &profiles [task-main, architect, reviewer, coder, debugger, project-steward]
policies:
  task_main: &task_main
    allowed_profiles: [task-main]
    denied_profiles: [architect, reviewer, coder, debugger, project-steward]
    transports: [cli, api_server]
    activation_targets: [hermes-agent, hermes-webui, new-session]
    exact_dispatch_required: true
  all_profiles: &all_profiles
    allowed_profiles: *profiles
    denied_profiles: []
    transports: [cli, api_server]
    activation_targets: [hermes-agent, hermes-webui, new-session]
    exact_dispatch_required: true
  workers: &workers
    allowed_profiles: [architect, reviewer, coder, debugger, project-steward]
    denied_profiles: [task-main]
    transports: [cli, api_server]
    activation_targets: [hermes-agent, hermes-webui, new-session]
    exact_dispatch_required: true
  no_profile: &no_profile
    allowed_profiles: []
    denied_profiles: *profiles
    transports: [cli, api_server]
    activation_targets: [hermes-agent, hermes-webui, new-session]
    exact_dispatch_required: true
  project_readers: &project_readers
    allowed_profiles: [architect, reviewer, coder, project-steward]
    denied_profiles: [task-main, debugger]
    transports: [cli, api_server]
    activation_targets: [hermes-agent, hermes-webui, new-session]
    exact_dispatch_required: true
  repo_readers: &repo_readers
    allowed_profiles: [task-main, architect, reviewer, coder, debugger]
    denied_profiles: [project-steward]
    transports: [cli, api_server]
    activation_targets: [hermes-agent, hermes-webui, new-session]
    exact_dispatch_required: true
  web_readers: &web_readers
    allowed_profiles: [task-main, architect, debugger]
    denied_profiles: [reviewer, coder, project-steward]
    transports: [cli, api_server]
    activation_targets: [hermes-agent, hermes-webui, new-session]
    exact_dispatch_required: true
  architect: &architect
    allowed_profiles: [architect]
    denied_profiles: [task-main, reviewer, coder, debugger, project-steward]
    transports: [cli, api_server]
    activation_targets: [hermes-agent, hermes-webui, new-session]
    exact_dispatch_required: true
  reviewer: &reviewer
    allowed_profiles: [reviewer]
    denied_profiles: [task-main, architect, coder, debugger, project-steward]
    transports: [cli, api_server]
    activation_targets: [hermes-agent, hermes-webui, new-session]
    exact_dispatch_required: true
  coder: &coder
    allowed_profiles: [coder]
    denied_profiles: [task-main, architect, reviewer, debugger, project-steward]
    transports: [cli, api_server]
    activation_targets: [hermes-agent, hermes-webui, new-session]
    exact_dispatch_required: true
  debugger: &debugger
    allowed_profiles: [debugger]
    denied_profiles: [task-main, architect, reviewer, coder, project-steward]
    transports: [cli, api_server]
    activation_targets: [hermes-agent, hermes-webui, new-session]
    exact_dispatch_required: true
  steward: &steward
    allowed_profiles: [project-steward]
    denied_profiles: [task-main, architect, reviewer, coder, debugger]
    transports: [cli, api_server]
    activation_targets: [hermes-agent, hermes-webui, new-session]
    exact_dispatch_required: true

