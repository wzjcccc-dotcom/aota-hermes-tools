project_lifecycle_contract:
  canonical_source: plugin/aota-tools/_project_lifecycle_contract.py
  dispatch_invariant: PROJECT_AND_PROFILE_MUTATION_REQUIRES_TASK_MAIN_DISPATCH
  dispatch_authority_profiles: [task-main]
  execution_owner_profiles: [project-steward]
  protected_mutation_classes:
    - project_initialization
    - project_git_lifecycle
    - project_codegraph_lifecycle
    - project_registry_mutation
    - project_closure
    - project_metadata_mutation
  runtime_artifact_write_exemptions:
    - CARD
    - RESULT
    - worker_outcome
    - completion_receipt
    - handoff
    - review_decision
    - task_runtime_meta
    - bounded_logs
    - bounded_temporary_state
  task_main_authority:
    - dispatch
    - spec_creation
    - spec_freeze
    - task_approval
    - task_start
    - durable_decision
    - work_item_closure
    - workspace_selection
  project_steward_authority:
    - docs_update
    - artifact_link
    - registry_refresh
    - close_checks
    - context_prepare
    - relationship_resolve
  initialization_states:
    - initialized_core
    - initialized
    - failed
  initialization_receipt_minimum_fields:
    - schema_version
    - project_id
    - workspace_id
    - state
    - git_summary
    - codegraph_summary
    - authority
    - completed_at
  receipt_authorities:
    - trusted_finalizer
    - authoritative_receipt
  worker_observation_artifacts:
    - CARD
    - RESULT
  codex_escalation_boundary:
    current_fallback_dependency: REQUIRED
    target_default_project_operator: NOT_REQUIRED
    boundary: host_infra_escalation
  fail_closed_reject_reasons:
    - non_task_main_protected_mutation_spec
    - unfrozen_spec
    - binding_mismatch
    - profile_mismatch
    - artifact_exemption_used_for_project_source_write
    - steward_mutation_missing_binding
    - initialized_receipt_missing_git_codegraph_summary
    - receipt_authoritative_wrong_reconciliation_source
    - unknown_initialization_state
    - unknown_protected_mutation_class

skill_authority_contract:
  canonical_source: plugin/aota-tools/_skill_authority_contract.py
  deployment_authority: false
  source_authority: repository_canonical
  runtime_projection_not_canonical: true
  owning_profiles_not_active_skills: true
  runtime_discoverable_not_managed: true
  runtime_discoverable_not_authoritative: true
  source_classes:
    - canonical_managed
    - profile_specific_managed
    - bundled_or_global
    - runtime_generated
    - unmanaged
  activation_classes:
    - active
    - reference
    - discoverable
    - disabled
  collision_resolution_order:
    - profile_specific_managed
    - canonical_managed
    - bundled_or_global
    - unmanaged
    - runtime_generated
  override_requires_explicit_declaration: true
  reference_routing_map:
    intake: aota-work-classify
    spec_create: aota-spec-driven-implementation
    spec_retry: aota-spec-driven-implementation
    task_start_wait_handoff: aota-task-lifecycle
    tool_failure: aota-tool-failure-fallback
    coder: aota-spec-driven-implementation
    reviewer: aota-implementation-review
  orchestration_entry_point: aota-profile-task-orchestration
  wait_mode_classes:
    - wakeup_capable_normal
    - non_wakeup_transport
    - isolated_probe
    - recovery
  wait_mode_rules:
    wakeup_capable_normal:
      polling_prohibited: true
    non_wakeup_transport:
      explicit_retrieval_allowed: true
    isolated_probe:
      requires_marker: POLLING_ALLOWED_FOR_ISOLATED_PROBE_ONLY
    recovery:
      requires_reason: true
  fail_closed_reject_reasons:
    - undeclared_collision
    - override_missing_explicit_declaration
    - runtime_projection_treated_as_canonical
    - inventory_as_deployment_authority
    - unknown_source_class
    - unknown_activation_class
    - unknown_wait_mode
    - isolated_probe_polling_without_marker
    - recovery_without_reason
    - path_length_authority_inference
  migration_findings:
    - id: MF-01
      title: "orchestration/ namespace contains Skills not formally managed"
      classification: unmanaged_runtime_projection
      status: resolved_in_source
      resolution: "5 reference Skills created in canonical source; profile-runtime-assembly.yaml updated with reference_skills declarations; lifecycle inventory updated with canonical_managed entries"
      pending_deploy: true
    - id: MF-02
      title: "aota-task-lifecycle source version diverges from profile-local detailed version"
      classification: source_runtime_divergence
      status: resolved_in_source
      resolution: "Wait mode semantics and binding/receipt/handoff authority sections merged into canonical source skills/aota-task-lifecycle/SKILL.md"
      pending_deploy: true
    - id: MF-03
      title: "Missing source for 5 profile-local Skills"
      classification: missing_canonical_source
      status: resolved_in_source
      resolution: "Canonical source created for aota-canonical-spec-contract, aota-canonical-spec-pitfalls, aota-work-classify-and-plan-gate, workspace-file-access-strategy, aota-multi-phase-doc-closure"
      pending_deploy: true

profile_task_launcher_hardening:
  source_handlers:
    - plugin/aota-tools/_profile_task_start.py
    - plugin/aota-tools/_task_spec_scope.py
    - plugin/aota-tools/_profile_task_scope.py
    - plugin/aota-tools/_project_file_mutation.py
    - plugin/aota-tools/_profile_task_env.py
    - plugin/aota-tools/_profile_task_paths.py
    - plugin/aota-tools/_profile_task_capture.py
    - plugin/aota-tools/_profile_task_launcher.py
    - plugin/aota-tools/_profile_task_finalize.py
    - plugin/aota-tools/_profile_task_status.py
    - plugin/aota-tools/_handoff_common.py
  activation_targets: [hermes-agent, hermes-webui, new-session]
  recreate_requirements: [hermes-agent, hermes-webui]
  durable_artifacts: [scope.json, workspace-baseline.json, scope-events.jsonl, worker.<task_id>.log, completion.<task_id>.json, failure_handoff]
  scope_contract:
    canonical_source: spec.payload
    write_does_not_require_read: true
    event_identity: [workspace_id, project_id, task_id, start_id, process_session_id, timestamp]
    workspace_diff_role: postflight_integrity_observation_only
