# W2 Deployment Projection — Deterministic AF Skill projection for progressive disclosure
# W0 Deployment Projection — Not Authority
# ```text
# AOTA_SKILL_CANONICAL_SOURCE=aota_forge
# DEPLOYMENT_PROJECTION_IS_AUTHORITY=no
# HOST_RUNTIME_LOCATION_IS_AUTHORITY=no
# ```
# This file is deployment/runtime projection only. Skill semantic authority is `aota_forge/skills/`.
# It may reference AF canonical Skills via projection; it does not define independent Skill authority.

schema_version: 1
assembly_version: 2
projection_contract_schema_version: 1

# W3 Thin-Host Cutover — Hermes is now a thin host (model+session+executor+MCP only).
# AF Role/SOUL/Tool/Skill authority is exclusively AF via role.bootstrap.
# Profile config/SOUL are host configuration only, not AF Role semantic authority.
# ```text
# HERMES_IS_THIN_HOST=yes
# HERMES_ROLE_SOUL_AUTHORITY=no
# HERMES_ROLE_TOOL_AUTHORITY=no
# HERMES_ROLE_SKILL_AUTHORITY=no
# AF_ROLE_SOUL_SOURCE=exclusive
# AF_ROLE_TOOL_AUTHORITY=exclusive
# AF_ROLE_SKILL_SOURCE=exclusive
# AF_SKILL_CANONICAL_SOURCE=aota_forge
# HERMES_PROFILE_LOCAL_AOTA_SKILL_PROJECTION_REQUIRED=no
# HERMES_NATIVE_SKILL_LOADER_REQUIRED=no
# ```
# For task-main (runtime aota-task-main) and aota-worker, native Tool/Skill/SOUL
# projection is removed. Active/reference Skills are empty: AF production Skills
# are delivered exclusively via AF role.bootstrap/skill.open, not via Hermes
# native/profile-local projection. Physical Skill assets may remain on disk
# (historical) but are not runtime-loaded or authoritative.
#
# Hermes runtime profile mapping:
# LOGICAL_AF_PROFILE_ID=task-main
# RUNTIME_HERMES_PROFILE_ID=aota-task-main
# TASK_MAIN_RUNTIME_PROFILE_MAPPING_EXPLICIT=yes
# logical task-main deployment projection → runtime aota-task-main (single deterministic truth)
profiles:
  task-main:
    config: profiles/task-main/config.yaml
    soul: profiles/task-main/SOUL.md
    plugin: plugin/aota-tools
    hermes_runtime_profile: aota-task-main
    active_skills: []
    reference_skills: []
  project-steward:
    config: profiles/project-steward/config.yaml
    soul: profiles/project-steward/SOUL.md
    plugin: plugin/aota-tools
    active_skills:
      - aota-pcf-project-steward
      - aota-workspace-model
      - aota-workspace-diagnostics
      - aota-task-lifecycle
      - aota-tool-failure-fallback
    reference_skills:
      - aota-profile-task-orchestration
      - aota-skill-development
      - aota-result-hydration
  architect:
    config: profiles/architect/config.yaml
    soul: profiles/architect/SOUL.md
    plugin: plugin/aota-tools
    active_skills:
      - aota-architecture-review
    reference_skills:
      - aota-result-hydration
  coder:
    config: profiles/coder/config.yaml
    soul: profiles/coder/SOUL.md
    plugin: plugin/aota-tools
    active_skills:
      - aota-spec-driven-implementation
    reference_skills:
      - aota-workspace-operations
      - aota-plugin-tool-development
      - aota-skill-development
      - aota-result-hydration
      - aota-restricted-shell
  debugger:
    config: profiles/debugger/config.yaml
    soul: profiles/debugger/SOUL.md
    plugin: plugin/aota-tools
    active_skills:
      - aota-evidence-first-debugging
    reference_skills:
      - aota-workspace-operations
      - aota-result-hydration
  reviewer:
    config: profiles/reviewer/config.yaml
    soul: profiles/reviewer/SOUL.md
    plugin: plugin/aota-tools
    active_skills:
      - aota-implementation-review
    reference_skills:
      - aota-workspace-operations
      - aota-result-hydration

# Exact Host runtime projections.  These five profile-local plugin roots are
# intentionally symlinks to the one canonical global plugin root.  The
# deployment adapter accepts only these declarations; project-steward is an
# ordinary managed directory and is therefore not a projection.
# Runtime profile mapping: logical task-main → runtime aota-task-main (explicit)
plugin_projections:
  - type: profile_plugin_global_projection
    profile: task-main
    logical_path: profiles/aota-task-main/plugins/aota-tools
    target_path: plugins/aota-tools
    write_mode: canonical_target_only
    verify_logical_path: true
  - type: profile_plugin_global_projection
    profile: architect
    logical_path: profiles/architect/plugins/aota-tools
    target_path: plugins/aota-tools
    write_mode: canonical_target_only
    verify_logical_path: true
  - type: profile_plugin_global_projection
    profile: coder
    logical_path: profiles/coder/plugins/aota-tools
    target_path: plugins/aota-tools
    write_mode: canonical_target_only
    verify_logical_path: true
  - type: profile_plugin_global_projection
    profile: debugger
    logical_path: profiles/debugger/plugins/aota-tools
    target_path: plugins/aota-tools
    write_mode: canonical_target_only
    verify_logical_path: true
  - type: profile_plugin_global_projection
    profile: reviewer
    logical_path: profiles/reviewer/plugins/aota-tools
    target_path: plugins/aota-tools
    write_mode: canonical_target_only
    verify_logical_path: true

# Same-name override declarations: when a Skill with the same bare name exists
# in both canonical_managed and another source class, the override must be
# explicitly declared here.  No undeclared collisions are permitted.
overrides: []

# Profile Task runner contract.  The launcher is Host-migration owned and is
# referenced by absolute path; it is never copied into the plugin directory.
profile_task_runner:
  contract_version: 2
  default_runner: /home/latios/.local/bin/hermes-host
  official_executable: /home/latios/.venvs/hermes-agent-host/bin/hermes
  forbidden_runner: /usr/local/bin/hermes
  docker_runner_forbidden: true
  path_fallback_allowed: false
  shell_execution_allowed: false
  worker_toolset_source: WORKER_PROFILE
  parent_toolset_inherited: false
  deployment_ownership: host_migration_launcher
